name: Bug report
description: Something isn't working as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Before you paste anything, remove Rivian tokens, passwords, your VIN, and locations.
        For a security problem, don't open an issue: follow [SECURITY.md](https://github.com/blike/rivianmate/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: If it happens in demo mode (`MOCK_RIVIAN=1`) too, say so.
      placeholder: |
        1. Open Charging
        2. Pick a session from yesterday
        3. ...
  - type: input
    id: version
    attributes:
      label: RivianMate version
      description: Shown in Settings → About, or the Docker image tag you run.
      placeholder: v0.5.0
    validations:
      required: true
  - type: dropdown
    id: vehicle
    attributes:
      label: Vehicle
      options:
        - R1S
        - R1T
        - R2
        - R3
        - Commercial van
        - Other or several
    validations:
      required: true
  - type: dropdown
    id: data
    attributes:
      label: Vehicle data
      description: Shown next to the vehicle in Settings → General.
      options:
        - Parallax data
        - Classic data
        - Not sure
  - type: dropdown
    id: deployment
    attributes:
      label: How do you run RivianMate?
      options:
        - Docker Compose (bundled Postgres)
        - Docker with an external Postgres
        - From source
        - Other
  - type: input
    id: browser
    attributes:
      label: Browser and device
      description: For problems with the web app.
      placeholder: Safari on iPhone 16, Chrome 141 on macOS
  - type: textarea
    id: logs
    attributes:
      label: Server logs
      description: From around when it happened, e.g. `docker compose logs rivianmate --since 1h`. Remove tokens, VINs and locations.
      render: shell
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Optional. Crop out anything personal.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed tokens, passwords, VINs and locations from everything above.
          required: true
